# BEGIN lists — managed by lists.remypost.me/deploy (replaces everything up to END lists)
# lists.remypost.me: local-first to-do PWA. Static app + the lists-sync container on n8n_default.
#   App:  /srv/sites/lists/current -> releases/<name>   (built by build.mjs: hashed /assets/*, .br/.gz sidecars)
#   API:  /api/* -> lists-sync:8787  (server/sync_server.py; ciphertext only, see server/README.md)
#   MCP:  /mcp, /mcp-admin/* -> lists-mcp:8788  (mcp/; the Claude & Grok connector, see mcp/README.md)
# CSP: no inline script or style. If index.html ever inlines a <script> or <style>, add its
# 'sha256-…' source (printed by the build) to script-src / style-src below; never 'unsafe-inline'.
(lists) {
	# Not on /mcp or /mcp-admin/*: SSE streams and small JSON bodies gain nothing from compression.
	# KiB below, not KB (Caddy's KB is 1000): the bridge's own JSON 413 is then always the one clients see.
	@compress not path /mcp /mcp-admin/*
	encode @compress zstd gzip
	header {
		Strict-Transport-Security "max-age=31536000"
		X-Content-Type-Options "nosniff"
		Referrer-Policy "no-referrer"
		X-Frame-Options "DENY"
		Cross-Origin-Opener-Policy "same-origin"
		Permissions-Policy "camera=(), microphone=(), geolocation=(), browsing-topics=()"
		Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self' blob:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
		X-Robots-Tag "noindex, nofollow, noarchive"
		-Server
	}

	handle /api/* {
		request_body {
			max_size 2MB
		}
		# Rides out a container restart instead of answering 502. Only failed dials are retried,
		# so a request the server already answered is never replayed (and /api/sync is idempotent anyway).
		reverse_proxy lists-sync:8787 {
			header_up X-Real-IP {remote_host}
			lb_try_duration 10s
			lb_try_interval 250ms
		}
	}

	# The connector is authless: OAuth discovery must find a clean 404, not the app's index.html.
	@oauthwk path /.well-known/oauth-protected-resource* /.well-known/oauth-authorization-server* /.well-known/openid-configuration*
	handle @oauthwk {
		respond 404
	}

	# Exact path, so /mcp-admin is not swallowed. The bridge checks Host and Origin itself and believes
	# X-Real-IP only from this container (LISTS_TRUSTED_PROXIES).
	handle /mcp {
		request_body {
			max_size 256KiB
		}
		reverse_proxy lists-mcp:8788 {
			header_up X-Real-IP {remote_host}
			flush_interval -1
			lb_try_duration 10s
			lb_try_interval 250ms
		}
	}
	handle /mcp-admin/* {
		request_body {
			max_size 4KiB
		}
		reverse_proxy lists-mcp:8788 {
			header_up X-Real-IP {remote_host}
			lb_try_duration 10s
			lb_try_interval 250ms
		}
	}

	handle {
		root * /srv/sites/lists/current
		@assets path /assets/*
		header @assets Cache-Control "public, max-age=31536000, immutable"
		# index.html, sw.js, manifest.webmanifest, icons: always revalidate
		@fresh not path /assets/*
		header @fresh Cache-Control "no-cache"
		try_files {path} /index.html
		file_server {
			precompressed br gzip
		}
	}
}

lists.remypost.me {
	import lists
}
# END lists
