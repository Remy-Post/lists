<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Lists</title>
<meta name="description" content="Unlimited lists, unlimited depth. Local-first, keyboard-first, fast on any connection.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f8fafd" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1f2329" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/apple-180.png">
<script>try{var t=localStorage.getItem('lists.theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="/assets/app.css">
<link rel="stylesheet" href="/assets/phone.css" media="(max-width: 599.98px)">
<link rel="stylesheet" href="/assets/desk.css" media="(min-width: 1200px)">
<link rel="modulepreload" href="/assets/app.js">
<script type="module" src="/assets/app.js"></script>
</head>
<body data-view="today">
<div class="app" id="app">
  <aside class="side" id="side" aria-label="Navigation">
    <div class="side-head">
      <span class="wordmark">Lists<svg class="wm-strike" viewBox="0 0 64 10" aria-hidden="true" preserveAspectRatio="none"><path d="M1.5 6.8C16 4.6 36 5.6 62.5 3.2"/></svg></span>
      <button class="icon-btn" id="searchBtn" aria-label="Search and commands"><svg viewBox="0 0 20 20"><circle cx="8.8" cy="8.8" r="5.3"/><path d="m12.8 12.8 3.7 3.7"/></svg></button>
    </div>
    <nav class="views" aria-label="Views">
      <a class="nv" href="#/inbox" data-nav="inbox"><svg viewBox="0 0 20 20"><path d="M3.5 11.5 5.6 4.8a1.5 1.5 0 0 1 1.4-1h6a1.5 1.5 0 0 1 1.4 1l2.1 6.7v3.2a1.5 1.5 0 0 1-1.5 1.5h-10a1.5 1.5 0 0 1-1.5-1.5Z"/><path d="M3.5 11.5h3.8l.9 1.8h3.6l.9-1.8h3.8"/></svg><span>Inbox</span><span class="n"></span></a>
      <a class="nv" href="#/today" data-nav="today"><svg viewBox="0 0 20 20"><rect x="3.5" y="4.5" width="13" height="12" rx="2.5"/><path d="M3.5 8.5h13M7 3v3M13 3v3"/><path class="dot" d="M10 12.5h.01"/></svg><span>Today</span><span class="n"></span></a>
      <a class="nv" href="#/upcoming" data-nav="upcoming"><svg viewBox="0 0 20 20"><rect x="3.5" y="4.5" width="13" height="12" rx="2.5"/><path d="M3.5 8.5h13M7 3v3M13 3v3M7 12h2M11 12h2M7 14.5h2"/></svg><span>Upcoming</span><span class="n"></span></a>
      <a class="nv" href="#/someday" data-nav="someday"><svg viewBox="0 0 20 20"><path d="M4 6.5h12v9a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 4 15.5Z"/><path d="M3 3.5h14v3H3zM8 10h4"/></svg><span>Someday</span><span class="n"></span></a>
      <a class="nv" href="#/logbook" data-nav="logbook"><svg viewBox="0 0 20 20"><path d="M5 3.5h9.5a1.5 1.5 0 0 1 1.5 1.5v11.5H5.5A1.5 1.5 0 0 1 4 15V4.5a1 1 0 0 1 1-1Z"/><path d="m7.5 9.8 1.8 1.8 3.4-3.6"/></svg><span>Logbook</span><span class="n"></span></a>
    </nav>
    <div class="side-sec"><span>Lists</span><button class="icon-btn sm" id="newList" aria-label="New list"><svg viewBox="0 0 20 20"><path d="M10 4.5v11M4.5 10h11"/></svg></button></div>
    <nav class="side-lists" id="sideLists" aria-label="Lists"></nav>
    <footer class="side-foot">
      <a class="nv sm" href="#/trash" data-nav="trash"><svg viewBox="0 0 20 20"><path d="M4.5 6h11M8 6V4.5h4V6M6 6l.7 9.6a1.5 1.5 0 0 0 1.5 1.4h3.6a1.5 1.5 0 0 0 1.5-1.4L14 6"/></svg><span>Trash</span><span class="n"></span></a>
      <button class="sync" id="sync" data-state="unpaired"><i class="glyph" aria-hidden="true"></i><span class="sl">On this device</span></button>
      <button class="icon-btn" id="settingsBtn" aria-label="Settings"><svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="2.4"/><path d="M10 2.8v2M10 15.2v2M2.8 10h2M15.2 10h2M4.9 4.9l1.4 1.4M13.7 13.7l1.4 1.4M4.9 15.1l1.4-1.4M13.7 6.3l1.4-1.4"/></svg></button>
    </footer>
  </aside>
  <div class="scrim-side" id="scrimSide"></div>
  <main class="main" id="main" tabindex="-1">
    <div class="sheet">
      <div class="topbar">
        <button class="icon-btn menu" id="menuBtn" aria-label="Lists and views" aria-expanded="false" aria-controls="side"><svg viewBox="0 0 20 20"><path d="M3.5 6h13M3.5 10h13M3.5 14h8"/></svg></button>
        <nav class="crumbs" id="crumbs" aria-label="Breadcrumbs"></nav>
        <button class="icon-btn more" id="moreBtn" aria-label="Commands"><svg viewBox="0 0 20 20"><circle cx="5" cy="10" r="1.2"/><circle cx="10" cy="10" r="1.2"/><circle cx="15" cy="10" r="1.2"/></svg></button>
      </div>
      <header class="page-head">
        <div class="stack" id="stack" aria-hidden="true"></div>
        <h1 class="ptitle" id="ptitle" tabindex="-1">Today</h1>
        <p class="psub" id="psub"></p>
        <div class="pnotes" id="pnotes" hidden></div>
      </header>
      <div class="outline" id="outline" role="tree" aria-label="Items" aria-multiselectable="true"></div>
      <div class="empty" id="empty" hidden></div>
      <div class="tail" id="tail" aria-hidden="true"></div>
    </div>
  </main>
  <aside class="insp" id="insp" aria-label="Details" hidden></aside>
  <nav class="bar" id="bar" aria-label="Views">
    <a href="#/inbox" data-nav="inbox" class="bt"><svg viewBox="0 0 20 20"><path d="M3.5 11.5 5.6 4.8a1.5 1.5 0 0 1 1.4-1h6a1.5 1.5 0 0 1 1.4 1l2.1 6.7v3.2a1.5 1.5 0 0 1-1.5 1.5h-10a1.5 1.5 0 0 1-1.5-1.5Z"/><path d="M3.5 11.5h3.8l.9 1.8h3.6l.9-1.8h3.8"/></svg><span>Inbox</span></a>
    <a href="#/today" data-nav="today" class="bt"><svg viewBox="0 0 20 20"><rect x="3.5" y="4.5" width="13" height="12" rx="2.5"/><path d="M3.5 8.5h13M7 3v3M13 3v3"/></svg><span>Today</span></a>
    <button class="add" id="addBtn" aria-label="Add item"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    <a href="#/upcoming" data-nav="upcoming" class="bt"><svg viewBox="0 0 20 20"><rect x="3.5" y="4.5" width="13" height="12" rx="2.5"/><path d="M3.5 8.5h13M7 3v3M13 3v3M7 12h2M11 12h2"/></svg><span>Upcoming</span></a>
    <a href="#/logbook" data-nav="logbook" class="bt"><svg viewBox="0 0 20 20"><path d="M5 3.5h9.5a1.5 1.5 0 0 1 1.5 1.5v11.5H5.5A1.5 1.5 0 0 1 4 15V4.5a1 1 0 0 1 1-1Z"/><path d="m7.5 9.8 1.8 1.8 3.4-3.6"/></svg><span>Logbook</span></a>
  </nav>
</div>
<div id="layer"></div>
<div id="live" class="vh" role="status" aria-live="polite"></div>
<noscript><p class="nojs">Lists needs JavaScript to run.</p></noscript>
</body>
</html>
